[dataset]
name = "ISIC2019"
yaml_file = '/workspace/home/data/datasets.yaml'

[confounder_classification]
use_existing = 'gt'

[segmentation]
model = 'groundingRMBG2'
custom_vocabulary = [
    "colorful patch",
    "colorful sticker",
    "colorful circle",
    "colorful cutted circle",
]

[inpainting]
model = 'iopaint_lama_sdxl'
prompt = "part of skin in homogenous skin color"

[inpainting.dilation]
width = 299
height = 299
kernel_size = 5
iterations = 5
