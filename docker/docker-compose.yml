version: '3.6'
services:
  svenja_thesis:
    privileged: true
    container_name: svenja_thesis
    image: svenja_thesis
    build:
     context: .
     dockerfile: Dockerfile
    shm_size: 100gb
    volumes:
     - /storage-01/ml-stud-share/ml-stud21:/workspace
     - /home/ml-stud21
    entrypoint: zsh
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            capabilities: [gpu]
    ports:
      - "1888:8888"

