services:
  llavatrainer:
    container_name: llava
    image: llava
    build:
      context: .
      dockerfile: Dockerfile
    stdin_open: true
    tty: true
    entrypoint: bash
    ports:
      - "2650:8889"
      - "2222:2222"
    volumes:
      - /storage-01/datasets/ISIC19/:/workspace/datasets/ISIC19/
      - /storage-01/ml-stud-share/ml-stud21:/workspace/home01
      - /home/ml-stud21:/workspace/home
    working_dir: /workspace
    shm_size: '200gb'
    deploy:
      resources:
        limits:
          cpus: '50'
          memory: 500g
        reservations:
          devices:
            - driver: nvidia
              #              device_ids: [ '2' ]
              capabilities: [ gpu ]
